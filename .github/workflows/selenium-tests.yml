name: Selenium Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 👈 This enables the manual "Run workflow" button in your GitHub browser!

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn clean test